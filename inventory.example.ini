# Example Ansible inventory
# Replace the example values with your environment.

[minecraft]
minecraft01 ansible_host=192.0.2.10

[monitoring]
monitor01 ansible_connection=local

[minecraft:vars]
ansible_user=your_username
ansible_ssh_private_key_file=~/.ssh/id_ed25519_ansible
ansible_become_exe=/usr/bin/sudo.ws

[monitoring:vars]
ansible_become_exe=/usr/bin/sudo.ws
